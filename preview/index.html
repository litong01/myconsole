<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>myconsole preview</title>
  <style>
    .preview-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 99;
      padding: 10px 16px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #9aa0a6;
      background: rgba(0, 0, 0, 0.75);
      text-align: center;
    }
    .preview-banner code {
      color: #c4c7c5;
    }
  </style>
</head>
<body>
  <!--
    Stand-in for Fully Kiosk's Universal Launcher markup.
    Names and icons here play the role of what you set in FKB;
    the theme below only lays them out.
  -->
  <div id="list">
    <a class="item" href="#">
      <img src="../icons/router.svg" alt="" />
      <span class="label">my router</span>
    </a>
    <a class="item" href="#">
      <img src="../icons/switch.svg" alt="" />
      <span class="label">my switch 109</span>
    </a>
    <a class="item" href="#">
      <img src="../icons/switch.svg" alt="" />
      <span class="label">my switch 110</span>
    </a>
    <a class="item" href="#">
      <img src="../icons/streaming.svg" alt="" />
      <span class="label">plex</span>
    </a>
    <a class="item" href="#">
      <img src="../icons/nas.svg" alt="" />
      <span class="label">nas</span>
    </a>
    <a class="item" href="#">
      <img src="../icons/wifi.svg" alt="" />
      <span class="label">upstairs ap</span>
    </a>
  </div>

  <p class="preview-banner">
    Desktop preview — on the tablet, paste <code>inject/launcher-inject.html</code> into FKB → Universal Launcher → Inject HTML Code.
  </p>

<style id="myconsole-styles">
  @import url("https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300;6..144,400;6..144,500&display=swap");

  :root {
    --mc-bg: #0b0b0c;
    --mc-bg-soft: #141416;
    --mc-text: #e8eaed;
    --mc-text-dim: rgba(232, 234, 237, 0.62);
    --mc-ring: rgba(255, 255, 255, 0.09);
    --mc-ring-hover: rgba(255, 255, 255, 0.16);
    --mc-glow: rgba(138, 180, 248, 0.18);
    --mc-tile: 132px;
    --mc-gap: 28px;
    --mc-font: "Google Sans Flex", "Google Sans", Roboto, system-ui, sans-serif;
  }

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    background:
      radial-gradient(1200px 700px at 50% 38%, #1a1d24 0%, transparent 62%),
      radial-gradient(900px 500px at 50% 100%, rgba(138, 180, 248, 0.06) 0%, transparent 55%),
      var(--mc-bg) !important;
    color: var(--mc-text) !important;
    font-family: var(--mc-font) !important;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Hide default launcher chrome if present */
  body > h1,
  body > h2,
  body > hr,
  #title,
  .title {
    display: none !important;
  }

  #myconsole-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    padding: 28px 24px 0;
    text-align: center;
  }

  #myconsole-header .clock {
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--mc-text);
  }

  #myconsole-header .date {
    margin-top: 8px;
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    font-weight: 400;
    color: var(--mc-text-dim);
  }

  #myconsole-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 88px 24px;
    box-sizing: border-box;
  }

  /* FKB Universal Launcher list container */
  #list,
  body > table,
  .list {
    display: grid !important;
    place-content: center !important;
    place-items: center !important;
    justify-content: center !important;
    align-content: center !important;
    gap: var(--mc-gap) !important;
    width: min(920px, 100%) !important;
    max-width: 100% !important;
    margin: 0 auto !important;
    padding: 0 !important;
    border: 0 !important;
    background: transparent !important;
    grid-template-columns: repeat(var(--mc-cols, 3), minmax(0, var(--mc-tile))) !important;
  }

  /* Each shortcut tile */
  #list .item,
  #list > tbody > tr,
  .list .item,
  a.item,
  div.item {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    width: var(--mc-tile) !important;
    min-width: var(--mc-tile) !important;
    max-width: var(--mc-tile) !important;
    margin: 0 !important;
    padding: 0 !important;
    text-decoration: none !important;
    color: inherit !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    float: none !important;
    vertical-align: top !important;
    transform: translateZ(0);
    transition: transform 180ms ease, filter 180ms ease;
  }

  #list .item:active,
  .list .item:active {
    transform: scale(0.96);
  }

  /* Circular icon well — Nest-like soft disc */
  #list .item .icon,
  #list .item img,
  .list .item img,
  #list .item .img,
  #list > tbody > tr img {
    display: block !important;
    width: var(--mc-tile) !important;
    height: var(--mc-tile) !important;
    margin: 0 auto 14px !important;
    padding: 28px !important;
    box-sizing: border-box !important;
    object-fit: contain !important;
    border-radius: 50% !important;
    background:
      radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 55%, rgba(0, 0, 0, 0.15) 100%),
      var(--mc-bg-soft) !important;
    border: 1px solid var(--mc-ring) !important;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
    filter: saturate(0.92) brightness(1.05);
  }

  #list .item:hover img,
  .list .item:hover img {
    border-color: var(--mc-ring-hover) !important;
    box-shadow:
      0 22px 48px rgba(0, 0, 0, 0.42),
      0 0 0 1px var(--mc-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
  }

  /* Labels */
  #list .item .label,
  #list .item span,
  #list .item font,
  .list .item .label,
  #list > tbody > tr td:last-child,
  #list .item div:not(.icon):not(.img) {
    display: block !important;
    max-width: calc(var(--mc-tile) + 36px) !important;
    margin: 0 auto !important;
    padding: 0 4px !important;
    text-align: center !important;
    font-family: var(--mc-font) !important;
    font-size: 0.92rem !important;
    font-weight: 400 !important;
    line-height: 1.25 !important;
    letter-spacing: 0.01em;
    color: var(--mc-text-dim) !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    background: transparent !important;
    border: 0 !important;
  }

  /* Flatten table-based legacy launcher markup */
  #list > tbody,
  #list > tbody > tr > td {
    display: contents !important;
    border: 0 !important;
    background: transparent !important;
  }

  /* Portrait tablets: slightly smaller tiles */
  @media (orientation: portrait) {
    :root {
      --mc-tile: 118px;
      --mc-gap: 22px;
    }
  }

  @media (max-width: 640px) {
    :root {
      --mc-tile: 104px;
      --mc-gap: 18px;
    }
  }
</style>

<div id="myconsole-header" aria-hidden="true">
  <div class="clock" id="myconsole-clock">--:--</div>
  <div class="date" id="myconsole-date">&nbsp;</div>
</div>

<div id="myconsole-stage"></div>

<script id="myconsole-script">
(function () {
  "use strict";

  /**
   * Layout only. Names and icons come from Fully Kiosk
   * (Universal Launcher -> Select Items to Show) and are left untouched.
   */

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $all(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function updateClock() {
    var now = new Date();
    var clock = $("#myconsole-clock");
    var date = $("#myconsole-date");
    if (!clock || !date) return;
    clock.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    date.textContent = now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  function findList() {
    return $("#list") || $(".list") || $("table");
  }

  /** Columns chosen so the tiles stay visually balanced and centered */
  function columnCount(n) {
    if (n <= 1) return 1;
    if (n <= 4) return 2;
    if (n <= 9) return 3;
    return 4;
  }

  function mountList() {
    var list = findList();
    var stage = $("#myconsole-stage");
    if (!list || !stage) return false;
    if (list.parentNode !== stage) {
      stage.appendChild(list);
    }
    return true;
  }

  function applyLayout() {
    var items = $all("#list .item, .list .item, #list > tbody > tr");
    if (!items.length) {
      items = $all("#list a, .list a");
    }
    if (!items.length) return;
    document.documentElement.style.setProperty(
      "--mc-cols",
      String(columnCount(items.length))
    );
  }

  function boot() {
    updateClock();
    window.setInterval(updateClock, 10000);

    if (!mountList()) {
      window.setTimeout(boot, 120);
      return;
    }
    applyLayout();

    var list = findList();
    if (list && window.MutationObserver) {
      new MutationObserver(function () {
        mountList();
        applyLayout();
      }).observe(list, { childList: true, subtree: true });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
