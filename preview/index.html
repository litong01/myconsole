<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>myconsole preview</title>

  <!-- Fully Kiosk's own launcher stylesheet, verbatim -->
  <style>
    * {margin:0; padding:0; }
    body {font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; text-align:left; box-sizing:border-box; overflow-x:hidden; min-height:100%; }
    body {background-color: #FFFFFF;}
    body {font-size: 100%;}
    body {margin-top: 1em;}
    div.app, div.bookmark {margin:0.5em 1em 0.5em 1em; float:left; width:4em;height:6em;overflow-y:hidden;border: 0px solid #555;}
    div.appIcon img, div.bookmarkIcon img {width:4em;height:4em;}
    div.appName, div.bookmarkName {font-size:0.7em;line-height:1.25em;font-weight:bold;text-align:center;}
    div.app a, div.bookmark a {text-decoration:none;color:black;}
    p.error {margin:2em; font-size:2em; color:red; text-align: center;}
  </style>

  <style>
    .preview-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 99;
      padding: 10px 16px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #9aa0a6;
      background: rgba(0, 0, 0, 0.75);
      text-align: center;
    }
    .preview-banner code {
      color: #c4c7c5;
    }
  </style>

<template id="mc-theme">
<style id="myconsole-styles">
  :root {
    --mc-bg: #0b0b0c;
    --mc-bg-soft: #141416;
    --mc-text: #e8eaed;
    --mc-text-dim: rgba(232, 234, 237, 0.72);
    --mc-ring: rgba(255, 255, 255, 0.09);
    --mc-ring-hover: rgba(255, 255, 255, 0.16);
    --mc-glow: rgba(138, 180, 248, 0.18);
    --mc-tile: 132px;
    --mc-gap: 28px;
    --mc-cols: 3;
    /* Space under the circle, and how far the icon art is inset inside it */
    --mc-label-gap: 4px;
    --mc-icon-inset: 18px;
    --mc-label-size: 1.05rem;
    --mc-font: "Google Sans", Roboto, system-ui, -apple-system, sans-serif;
  }

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    text-align: center !important;
    background:
      radial-gradient(1200px 700px at 50% 38%, #1a1d24 0%, transparent 62%),
      radial-gradient(900px 500px at 50% 100%, rgba(138, 180, 248, 0.06) 0%, transparent 55%),
      var(--mc-bg) !important;
    color: var(--mc-text) !important;
    font-family: var(--mc-font) !important;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /*
    Body itself centers the launcher items, so the grid is centered even with no
    script at all. When the script does run it moves the items into
    #myconsole-stage, which centers them under the clock instead.
  */
  body {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: flex-start !important;
    align-content: center !important;
    justify-content: center !important;
    padding: 40px 24px !important;
  }

  #myconsole-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    padding: 28px 24px 0;
    text-align: center;
  }

  /* Only the clock takes taps, so the header cannot swallow a tile press */
  #myconsole-header .mc-clock {
    pointer-events: auto;
  }

  /* Diagnostic panel, opened by tapping the clock five times */
  #myconsole-report {
    position: fixed;
    inset: 0;
    z-index: 9;
    overflow: auto;
    padding: 20px;
    background: rgba(0, 0, 0, 0.92);
    color: #8ab4f8;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-all;
  }

  #myconsole-header .mc-clock {
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--mc-text);
  }

  #myconsole-header .mc-date {
    margin-top: 8px;
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    font-weight: 400;
    color: var(--mc-text-dim);
  }

  #myconsole-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 88px 24px;
    box-sizing: border-box;
  }

  #myconsole-grid {
    display: grid;
    grid-template-columns: repeat(var(--mc-cols), var(--mc-tile));
    justify-content: center;
    align-content: center;
    max-width: 100%;
  }

  /*
    Tiles: FKB uses div.app for apps and div.bookmark for URLs. These rules are
    deliberately not scoped to #myconsole-grid, so the tiles still look right
    (and labels stay visible) even if the script never moves them into the grid.
    FKB's own height:6em + overflow-y:hidden would otherwise clip the label.
  */
  div.app,
  div.bookmark,
  .mc-tile {
    float: none !important;
    width: var(--mc-tile) !important;
    height: auto !important;
    /* Margins rather than grid gap, so spacing also holds in the no-script path */
    margin: calc(var(--mc-gap) / 2) !important;
    padding: 0 !important;
    border: 0 !important;
    overflow: visible !important;
    background: transparent !important;
    transition: transform 180ms ease;
  }

  div.app:active,
  div.bookmark:active,
  .mc-tile:active {
    transform: scale(0.96);
  }

  div.app > a,
  div.bookmark > a,
  .mc-tile > a {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    text-decoration: none !important;
    color: var(--mc-text-dim) !important;
  }

  /* Round icon well */
  div.appIcon,
  div.bookmarkIcon,
  .mc-icon {
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: var(--mc-tile) !important;
    height: var(--mc-tile) !important;
    padding: var(--mc-icon-inset) !important;
    box-sizing: border-box !important;
    border-radius: 50% !important;
    background:
      radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 55%, rgba(0, 0, 0, 0.15) 100%),
      var(--mc-bg-soft) !important;
    border: 1px solid var(--mc-ring) !important;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
  }

  div.app > a:hover div.appIcon,
  div.bookmark > a:hover div.bookmarkIcon,
  .mc-tile > a:hover .mc-icon {
    border-color: var(--mc-ring-hover) !important;
    box-shadow:
      0 22px 48px rgba(0, 0, 0, 0.42),
      0 0 0 1px var(--mc-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
  }

  /* FKB sizes icons at 4em; fill the well instead */
  div.appIcon img,
  div.bookmarkIcon img,
  .mc-icon img {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    background: transparent !important;
    border: 0 !important;
  }

  /*
    Labels: FKB defaults to 0.7em bold black, which is invisible here.
    .mc-label is applied by the script from the item's structure, so this also
    covers FKB builds that name these elements differently.
  */
  div.appName,
  div.bookmarkName,
  .mc-label {
    /* Long names wrap to a second line and clip after that, rather than
       spilling into the neighbouring tile */
    display: -webkit-box !important;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    max-width: calc(var(--mc-tile) + 8px) !important;
    margin: var(--mc-label-gap) auto 0 !important;
    padding: 0 4px !important;
    font-family: var(--mc-font) !important;
    font-size: var(--mc-label-size) !important;
    font-weight: 400 !important;
    line-height: 1.25 !important;
    letter-spacing: 0.01em;
    text-align: center !important;
    color: var(--mc-text-dim) !important;
    white-space: normal !important;
    overflow: hidden !important;
    overflow-wrap: break-word !important;
    background: transparent !important;
  }

  /* Inset scales with the tile so the artwork keeps the same proportions */
  @media (orientation: portrait) {
    :root {
      --mc-tile: 118px;
      --mc-gap: 22px;
      --mc-icon-inset: 16px;
    }
  }

  @media (max-width: 640px) {
    :root {
      --mc-tile: 104px;
      --mc-gap: 18px;
      --mc-icon-inset: 14px;
      --mc-label-size: 0.95rem;
    }
  }
</style>

<script id="myconsole-script">
(function () {
  "use strict";

  /**
   * Layout only. Names and icons come from Fully Kiosk
   * (Universal Launcher -> Select Items to Show) and are left untouched.
   *
   * FKB injects this into <head>, so everything is built from script once the
   * launcher items exist in <body>.
   *
   * May be started twice: directly, if the injected script tag executes, and
   * again by the loader below when it does not.
   */
  if (window.myconsoleStarted) return;
  window.myconsoleStarted = true;

  var ITEM_SELECTOR = "div.app, div.bookmark";

  /**
   * Launcher items, by class when FKB uses the documented markup and by shape
   * otherwise: a direct child of body holding a link with an image in it.
   */
  function findItems() {
    var items = document.querySelectorAll(ITEM_SELECTOR);
    if (items.length) return items;

    var found = [];
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var node = kids[i];
      if (node.id && node.id.indexOf("myconsole") === 0) continue;
      if (node.querySelector && node.querySelector("a img")) {
        found.push(node);
      }
    }
    return found;
  }

  /* One stamp per launcher load, so each icon is still fetched only once */
  var STAMP = String(Date.now());

  /**
   * Edited icon files keep the same path, so the WebView happily serves the
   * copy it already has. A per-load query string makes it fetch from disk
   * again. Skipped for data: URLs, where there is no file to re-read.
   */
  function refreshIcon(img) {
    var src = img.getAttribute("src") || "";
    if (!src || /^data:/i.test(src) || src.indexOf("mc=") !== -1) return;
    img.setAttribute("src", src + (src.indexOf("?") === -1 ? "?" : "&") + "mc=" + STAMP);
  }

  /** Tag icon and label so styling does not depend on FKB's class names */
  function tagParts(item) {
    item.classList.add("mc-tile");
    var link = item.querySelector("a") || item;
    var parts = link.children;
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part.querySelector && part.querySelector("img")) {
        part.classList.add("mc-icon");
        var images = part.getElementsByTagName("img");
        for (var j = 0; j < images.length; j++) {
          refreshIcon(images[j]);
        }
      } else if ((part.textContent || "").trim()) {
        part.classList.add("mc-label");
      }
    }
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function el(tag, id, className) {
    var node = document.createElement(tag);
    if (id) node.id = id;
    if (className) node.className = className;
    return node;
  }

  /**
   * Tap the clock five times to list what each tile actually loaded. Needed
   * because a stale looking icon can mean the file on disk is old, the WebView
   * served a cached copy, or FKB handed over a bitmap of its own - and those
   * look identical on screen but are fixed in different ways.
   */
  function showReport() {
    var old = document.getElementById("myconsole-report");
    if (old) {
      old.parentNode.removeChild(old);
      return;
    }

    var panel = el("div", "myconsole-report");
    var lines = ["tap to close", ""];
    var images = document.querySelectorAll("#myconsole-grid img");

    for (var i = 0; i < images.length; i++) {
      var img = images[i];
      var loaded = img.complete && img.naturalWidth > 0;
      lines.push(
        (loaded ? "ok  " : "FAIL ") +
        img.naturalWidth + "x" + img.naturalHeight + "  " +
        (img.getAttribute("src") || "(no src)")
      );
    }

    if (!images.length) lines.push("no icons found in the grid");

    panel.textContent = lines.join("\n");
    panel.onclick = function () {
      panel.parentNode.removeChild(panel);
    };
    document.body.appendChild(panel);
  }

  function watchForReportTaps(clock) {
    var taps = 0;
    var timer = null;
    clock.addEventListener("click", function () {
      taps++;
      if (timer) window.clearTimeout(timer);
      timer = window.setTimeout(function () { taps = 0; }, 2500);
      if (taps >= 5) {
        taps = 0;
        showReport();
      }
    });
  }

  function buildChrome() {
    var header = document.getElementById("myconsole-header");
    if (!header) {
      header = el("div", "myconsole-header");
      var clock = header.appendChild(el("div", null, "mc-clock"));
      clock.textContent = "--:--";
      header.appendChild(el("div", null, "mc-date"));
      document.body.appendChild(header);
      watchForReportTaps(clock);
    }

    var stage = document.getElementById("myconsole-stage");
    if (!stage) {
      stage = el("div", "myconsole-stage");
      stage.appendChild(el("div", "myconsole-grid"));
      document.body.appendChild(stage);
    }

    return document.getElementById("myconsole-grid");
  }

  function updateClock() {
    var clock = document.querySelector("#myconsole-header .mc-clock");
    var date = document.querySelector("#myconsole-header .mc-date");
    if (!clock || !date) return;
    var now = new Date();
    clock.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    date.textContent = now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  /** Columns chosen so tiles stay balanced around the center */
  function columnCount(n) {
    if (n <= 1) return 1;
    if (n <= 4) return 2;
    if (n <= 9) return 3;
    return 4;
  }

  function layout() {
    var grid = buildChrome();
    if (!grid) return;

    var items = findItems();
    for (var i = 0; i < items.length; i++) {
      tagParts(items[i]);
      if (items[i].parentNode !== grid) {
        grid.appendChild(items[i]);
      }
    }

    var count = grid.children.length;
    if (count) {
      document.documentElement.style.setProperty("--mc-cols", String(columnCount(count)));
    }
  }

  function boot() {
    layout();
    updateClock();
    window.setInterval(updateClock, 10000);

    if (window.MutationObserver) {
      new MutationObserver(function () {
        layout();
      }).observe(document.body, { childList: true });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

<!--
  Fully Kiosk inserts this block with innerHTML, and a <script> tag added that
  way never executes - which left the items unmoved and their labels clipped.
  An inline handler on an inserted element does still fire, so this broken image
  re-adds the script above as a real element, which does execute.
-->
<img id="myconsole-loader" src="data:," alt="" style="display:none"
  onerror="(function(){var s=document.getElementById('myconsole-script');if(!s||window.myconsoleStarted)return;var n=document.createElement('script');n.text=s.textContent;document.head.appendChild(n);})()">

</template>
<script>
  document.head.insertAdjacentHTML(
    "beforeend",
    document.getElementById("mc-theme").innerHTML
  );
</script>
</head>
<body>
  <!-- Same shape FKB generates for each shortcut -->
  <div class="bookmark" id="b1">
    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/router.png" /></div>
      <div class="bookmarkName">my router</div>
    </a>
  </div>
  <div class="bookmark" id="b2">
    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/switch.png" /></div>
      <div class="bookmarkName">my switch 109</div>
    </a>
  </div>
  <div class="bookmark" id="b3">
    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/switch.png" /></div>
      <div class="bookmarkName">my switch 110</div>
    </a>
  </div>
  <div class="bookmark" id="b4">
    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/streaming.png" /></div>
      <div class="bookmarkName">plex</div>
    </a>
  </div>
  <div class="bookmark" id="b5">
    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/nas.png" /></div>

    </a>
  </div>

    <a href="#">
      <div class="bookmarkIcon"><img src="../icons/png/wifi.png" /></div>

    </a>
  </div>

  <p class="preview-banner">Desktop preview — theme injected exactly as Fully Kiosk injects it.</p>
</body>
</html>
