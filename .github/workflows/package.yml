name: Package tablet zip

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build zip
        run: bash tools/package.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: myconsole
          path: dist/myconsole.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tablet package
          target_commitish: ${{ github.sha }}
          files: dist/myconsole.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Download **myconsole.zip**, copy it to the tablet, and unzip so you get:

            `/sdcard/myconsole/`

            That folder should contain `inject/`, `icons/`, `fkb/`, and `README.md`.

            Then paste `inject/launcher-inject.html` into Fully Kiosk → Universal Launcher → Inject HTML Code, and add URLs as usual.
