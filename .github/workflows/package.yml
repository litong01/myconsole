name: Package tablet zip

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build zip
        run: bash tools/package.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: myconsole
          path: dist/myconsole.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tablet package
          target_commitish: ${{ github.sha }}
          files: dist/myconsole.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Download **myconsole.zip** on the tablet and unzip it where it lands, in the Downloads folder:

            `/sdcard/Download/myconsole/`

            That folder should contain `inject/`, `icons/`, `fkb/`, and `README.md`.

            Then install the theme with Fully Kiosk → Settings → Other Settings → **Import Settings**, picking:

            `/sdcard/Download/myconsole/fkb/myconsole-settings.json`

            After that, add URLs in Universal Launcher → Select Items to Show as usual, using icons from `myconsole/icons/png/` (FKB will not load the `.svg` sources).
